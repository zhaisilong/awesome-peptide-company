[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "awesome-peptide-company"
version = "0.3.0"
description = "Evidence-based directory of AI and peptide organizations"
readme = "README.md"
requires-python = ">=3.9"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [{name = "Zhai Silong", email = "zhaisilong@outlook.com"}]
dependencies = ["python-liquid>=1.10,<3"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
awepep-co = "awepep_co.cli:main"

[tool.setuptools.packages.find]
include = ["awepep_co*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
awepep_co = ["tables.json"]
